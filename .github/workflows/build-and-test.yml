# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build and test
on: [pull_request, push, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mesa-utils xvfb x11-xserver-utils

      - name: Checkout mod repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK versions
        uses: actions/setup-java@v6
        with:
          java-version: |
            8
            17
            21
            25
          distribution: 'zulu'
          problem-matcher: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          validate-wrappers: true

      # The runner filesystem is disposable. Cache this *pinned* dependency
      # across runs; editing our Java files must not re-download Reika's JAR.
      # Changing the versioned URL manifest automatically invalidates this key.
      - name: Restore DragonRealmCore cache
        id: dragonrealmcore-cache
        uses: actions/cache/restore@v6
        with:
          path: libs/DragonRealmCore 1.7.10 V33a.jar
          key: ${{ runner.os }}-dragonrealmcore-${{ hashFiles('.github/dependencies/dragonrealmcore.url') }}

      - name: Download DragonRealmCore (cache miss only)
        if: steps.dragonrealmcore-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          destination='libs/DragonRealmCore 1.7.10 V33a.jar'
          url=$(cat .github/dependencies/dragonrealmcore.url)
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file"' EXIT
          curl --fail --location --show-error --silent \
            --connect-timeout 15 --max-time 90 \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --output "$temp_file" "$url"
          jar tf "$temp_file" > /dev/null
          mv "$temp_file" "$destination"

      # Also validate restored caches before attempting to compile.
      - name: Verify DragonRealmCore
        shell: bash
        run: |
          set -euo pipefail
          test -s 'libs/DragonRealmCore 1.7.10 V33a.jar'
          jar tf 'libs/DragonRealmCore 1.7.10 V33a.jar' > /dev/null

      # Save *before* Gradle: cache the dependency even if our code fails later.
      # Fork PRs can restore the main-branch cache without saving a new copy.
      - name: Save DragonRealmCore cache
        if: steps.dragonrealmcore-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: libs/DragonRealmCore 1.7.10 V33a.jar
          key: ${{ steps.dragonrealmcore-cache.outputs.cache-primary-key }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check RWG1 biome selection parity
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/Rwg1BiomeSelection.java tests/Rwg1BiomeSelectionTest.java
          java -cp build/preview-tests Rwg1BiomeSelectionTest

      - name: Check stored biome decoding
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/StoredBiomeIds.java tests/StoredBiomeIdsTest.java
          java -cp build/preview-tests StoredBiomeIdsTest

      - name: Check cliff search bounds and memoization
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/CliffBiomeNeighborhood.java tests/CliffBiomeNeighborhoodTest.java
          java -cp build/preview-tests CliffBiomeNeighborhoodTest

      - name: Check RTG map-gen IDs and profiler attribution
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/RtgMapGenIds.java src/main/java/cc/unilock/dragonfixes/debug/StartupSubsystems.java tests/StartupOptimizationTest.java
          java -cp build/preview-tests StartupOptimizationTest

      - name: Check carver biome column memoization
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/CarverBiomeColumns.java tests/CarverBiomeColumnsTest.java
          java -cp build/preview-tests CarverBiomeColumnsTest

      - name: Check tightened cliff scan and aligned biome tiles
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/CliffBiomeNeighborhood.java tests/CliffBiomeTileTest.java
          java -cp build/preview-tests CliffBiomeTileTest

      - name: Check world-generation interception isolation
        run: |
          mkdir -p build/preview-tests
          javac --release 8 -d build/preview-tests src/main/java/cc/unilock/dragonfixes/compat/WorldgenChangeBuffer.java tests/WorldgenChangeBufferTest.java
          java -cp build/preview-tests WorldgenChangeBufferTest

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace setupCIWorkspace

      - name: Compile the mod
        run: ./gradlew --build-cache --info --stacktrace assemble

      - name: Attach compilation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.repository_id }}-build-libs
          path: build/libs/
          retention-days: 90

      - name: Run post-build checks
        id: build_mod
        run: xvfb-run --server-args="-screen 0 1366x768x24" ./gradlew --build-cache --info --stacktrace build
